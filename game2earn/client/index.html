<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Arena (Game2Earn)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
      #g2e-message { position: fixed; left: 0; right: 0; bottom: 14%; text-align: center; color: #e8ecf5;
        font: 15px/1.5 system-ui, sans-serif; pointer-events: none; z-index: 10; text-shadow: 0 1px 3px #000; }
      #g2e-message[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="g2e-message" hidden></div>
    <script>
      // Game2Earn : la page du jeu dans la plateforme (game2earn/client/index.html du dépôt g2e-sour).
      // Les paquets du jeu sont à côté (assets/) ; les cartes dessinées par l'admin sont publiées à part
      // (/v1/jeux/sour/v/cartes/<carte>-<version>/carte.source), leur liste vient de la fiche du jeu.
      var G2E = { integre: window.parent !== window, cartes: [], editeur: /[?&]editeur=1/.test(location.search) }
      var INJECTED_SOUR_CONFIG = { assets: ['assets/index.source'], servers: [], proxy: '', menuOptions: '' }
      try {
        var xhr = new XMLHttpRequest()
        xhr.open('GET', '/v1/jeux/sour', false)
        xhr.send()
        if (xhr.status === 200) {
          var cartes = (JSON.parse(xhr.responseText).jeu || {}).cartes || []
          G2E.cartes = cartes
          cartes.forEach(function (c) {
            if (c.admin && c.v) INJECTED_SOUR_CONFIG.assets.push('/v1/jeux/sour/v/cartes/' + encodeURIComponent(c.id + '-' + c.v) + '/carte.source')
          })
        }
      } catch (e) {
        console.warn('Game2Earn : liste des cartes illisible', e)
      }
      var Module = typeof Module !== 'undefined' ? Module : {}
      Module.preInit = []
      Module.preRun = []
      Module.noInitialRun = true
      Module.postRun = []
      var WASM_PROMISE_RESOLVE = null
      var WASM_PROMISE = new Promise(function (resolve) { WASM_PROMISE_RESOLVE = resolve })
    </script>
    <script src="index.js"></script>
    <script async src="game/api.js"></script>
    <script async src="game/sauerbraten.js"></script>
  </body>
</html>
