# Game2Earn : réglages du serveur de match (fusionnés avec ceux de Sour, pkg/config/schema.cue).
# Le match de défi lui-même (places, mode, carte, durée, résultat) vient de la variable G2E_MATCH posée par le Worker
# g2e-sour (pkg/server/service/g2e.go) ; les cartes de l'admin, de G2E_ASSETS.
server:
  presets:
    - name: "ffa-duel"
      virtual: true
      config:
        defaultMode: "ffa"
        defaultMap: "g2e_essai"
    - name: "insta-duel"
      virtual: true
      config:
        defaultMode: "insta"
        defaultMap: "g2e_essai"
    - name: "default"
      default: true
      config:
        defaultMode: "ffa"
        defaultMap: "g2e_essai"
    - name: "ffa"
      config:
        defaultMode: "ffa"
        defaultMap: "g2e_essai"
        maps:
          - "g2e_essai"
    - name: "insta"
      config:
        defaultMode: "insta"
        defaultMap: "g2e_essai"
        maps:
          - "g2e_essai"
