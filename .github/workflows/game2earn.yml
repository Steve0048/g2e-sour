# Game2Earn : compile Sour (le moteur de Cube 2 pour le navigateur, le client web et le serveur Go) sans aucun contenu
# du jeu Sauerbraten : ses cartes, modèles, armes et sons sont sous licences non commerciales (voir game2earn/README.md).
# Les contenus de Game2Earn (libres, usage commercial permis) sont assemblés par le job « contenus »
# (game2earn/contenus : images dessinées par programme, textures libres, sons de Red Eclipse, crédits).
name: Compilation Game2Earn

on:
  push:
    branches: [game2earn]

permissions:
  contents: write
  packages: write

concurrency:
  group: game2earn-compilation
  cancel-in-progress: true

jobs:
  jeu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Emscripten (la version du projet)
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install 3.1.8 && ./emsdk activate 3.1.8
      - name: Le moteur pour le navigateur
        run: |
          source emsdk/emsdk_env.sh
          cd game && ./build
          ls -la dist/game
      - uses: actions/upload-artifact@v4
        with:
          name: jeu
          path: game/dist/game/*

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "14.17.5"
      - name: Le client web
        run: |
          cd client
          yarn install
          yarn build
          cp src/index.html src/favicon.ico src/background.png dist/
          # La page du jeu dans Game2Earn (pont avec la plateforme : client/src/g2e.ts)
          cp ../game2earn/client/index.html dist/g2e.html
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: client/dist/*

  contenus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: sourdump (liste les fichiers utilisés par chaque carte)
        run: |
          pip install "swig==4.1.1"
          cd pkg/enet/enet && make && cd -
          go build -o "$RUNNER_TEMP/sourdump" ./cmd/sourdump
      - name: Les contenus du jeu (dossier racine) puis les paquets (.sour et index)
        run: |
          pip install pillow==12.0.0 numpy==2.3.4 cbor2==5.7.1
          cd game2earn/contenus
          python3 -I fabriquer.py "$RUNNER_TEMP/racine" --cache "$RUNNER_TEMP/cache"
          python3 -I paquets.py "$RUNNER_TEMP/racine" "$GITHUB_WORKSPACE/paquets" "$RUNNER_TEMP/sourdump"
          ls -la "$GITHUB_WORKSPACE/paquets" | tail -5
      - uses: actions/upload-artifact@v4
        with:
          name: contenus
          path: paquets/
          include-hidden-files: true
          retention-days: 30

  serveur:
    needs: [jeu, client]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client
          path: pkg/server/static/site
      - uses: actions/download-artifact@v4
        with:
          name: jeu
          path: pkg/server/static/site/game
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: SWIG 4.1.1 (une version plus récente change les types générés)
        run: pip install "swig==4.1.1" && swig -version | sed -n 2p
      - name: enet
        run: cd pkg/enet/enet && make
      - name: Le serveur (client et moteur intégrés)
        run: |
          go build -tags "release embed_frontend" -ldflags "-w -s" -o sour ./cmd/sour
          ./sour config > /dev/null && echo "Le serveur démarre et lit sa configuration."
          ls -la sour
      - name: Archive
        run: |
          mkdir -p paquet && cp sour paquet/ && cp -r pkg/server/static/site paquet/site
          tar -czf sour-game2earn.tar.gz -C paquet .
          sha256sum sour-game2earn.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sour-game2earn
          path: sour-game2earn.tar.gz
          retention-days: 30

  image:
    needs: [serveur, contenus]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sour-game2earn
      - uses: actions/download-artifact@v4
        with:
          name: contenus
          path: paquets
      - name: L'image du serveur de match
        run: |
          tar xzf sour-game2earn.tar.gz ./sour
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/g2e-sour-serveur"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -f game2earn/serveur/Dockerfile -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .
      - name: Essai de démarrage (port d'Edgegap, carte chargée)
        run: |
          docker run -d --name essai -e ARBITRIUM_PORT_WEB_INTERNAL=1500 -p 1500:1500 "$IMAGE:latest"
          for i in $(seq 1 30); do curl -sf -o /dev/null localhost:1500/ && break; sleep 1; done
          docker logs essai
          docker logs essai 2>&1 | grep -q "loaded [1-9][0-9]* maps"
          curl -sf -o /dev/null localhost:1500/ && echo "Le serveur répond."
      - name: Publication
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"

  # La version compilée du jeu pour le navigateur (client web, moteur, paquets) est publiée en « release »
  # (client-web.tar.gz), téléchargée et vérifiée par Game2Earn à la publication du jeu (Jeux/sour de la plateforme).
  publication:
    needs: [image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sour-game2earn
      - uses: actions/download-artifact@v4
        with:
          name: contenus
          path: client/assets
      - name: Publier la version (release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar xzf sour-game2earn.tar.gz ./site
          mv site/* client/
          VERSION="client-${{ github.run_number }}-${GITHUB_SHA::7}"
          tar -czf client-web.tar.gz -C client .
          sha256sum client-web.tar.gz | tee client-web.tar.gz.sha256
          gh release create "$VERSION" client-web.tar.gz client-web.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Client web Game2Earn $VERSION" \
            --notes "Sour (Cube 2) pour Game2Earn : client web, moteur et paquets du jeu (contenus libres, voir game2earn/contenus/credits.md), branche game2earn ($GITHUB_SHA)."
          echo "Version publiée : $VERSION"
